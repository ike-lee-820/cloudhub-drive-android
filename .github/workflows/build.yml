name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version (year.month.count)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, re, urllib.request

          now = datetime.datetime.now(datetime.timezone.utc)
          prefix = "v%02d.%02d." % (now.year % 100, now.month)
          tags = []
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100",
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "cloudhub-release-ci",
                  },
              )
              tags = json.load(urllib.request.urlopen(req, timeout=20))
          except Exception:
              tags = []

          nums = []
          for t in tags:
              m = re.match(r"^" + re.escape(prefix) + r"(\d+)$", t.get("name", ""))
              if m:
                  nums.append(int(m.group(1)))
          n = max(nums) + 1 if nums else 1
          version = "%02d.%02d.%d" % (now.year % 100, now.month, n)
          print("version=" + version)
          print("tag=" + prefix + str(n))
          PY

      - name: Locate Android SDK tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MGR=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          {
            echo "SDK=$SDK"
            echo "platforms: $(ls "$SDK/platforms" 2>&1 | tr '\n' ' ')"
            echo "build-tools: $(ls "$SDK/build-tools" 2>&1 | tr '\n' ' ')"
            echo "sdkmanager=$MGR"
          } | tee probe.log
          if [ -n "$MGR" ]; then
            dirname "$MGR" >> "$GITHUB_PATH"
            echo "SDKMANAGER=$MGR" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK packages if needed
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="${SDKMANAGER:-$(command -v sdkmanager || true)}"
          echo "manager=$MGR" | tee sdk.log
          if [ -d "$SDK/platforms/android-34" ] && [ -d "$SDK/build-tools/34.0.0" ]; then
            echo "Required SDK packages already present" | tee -a sdk.log
            exit 0
          fi
          if [ -z "$MGR" ] || [ ! -f "$MGR" ]; then
            echo "sdkmanager unavailable" | tee -a sdk.log
            exit 1
          fi
          yes | "$MGR" --licenses > sdk-licenses.log 2>&1 || true
          "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tee -a sdk.log

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret 未配置" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed release APK
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.ver.outputs.version }}" 2>&1 | tee build.log

      - name: Prepare release asset
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/CloudHubDrive-${{ steps.ver.outputs.version }}-release.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudhub-drive-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 云枢网盘 ${{ steps.ver.outputs.version }}
          body: |
            云枢网盘 Android 客户端 ${{ steps.ver.outputs.version }}

            - Release 签名，可直接覆盖安装
            - 应用内「设置 - 软件更新」自动检查 GitHub Release
            - 经 v6.gh-proxy.com 加速，64 线程分段下载并安装
          files: dist/*.apk
          draft: false
          prerelease: false

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            probe.log
            sdk.log
            sdk-licenses.log
            build.log
          if-no-files-found: ignore

      - name: Publish failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = []
          keys = ("e: ", "FAILURE:", "What went wrong", "Execution failed", "Caused by:",
                  "Unresolved reference", "None of the following", "Type mismatch",
                  "error:", "A problem occurred", "> Task ")
          for name in ["probe.log", "sdk.log", "build.log"]:
              f = Path(name)
              if not f.exists():
                  continue
              lines = f.read_text(errors="replace").splitlines()
              if name == "build.log":
                  idx = sorted({j for i, l in enumerate(lines)
                                if any(k in l for k in keys)
                                for j in range(max(0, i - 1), min(len(lines), i + 3))})
                  body = "\n".join(lines[i][:280] for i in idx)
              else:
                  body = "\n".join(lines)[-1200:]
              parts.append("===== " + name + " =====\n" + body)
          text = "\n".join(parts) or "no logs captured"
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for i in range(0, min(len(text), 28000), 3400):
              print("::error title=CloudHub CI diagnostics::" + text[i:i + 3400])
          PY
