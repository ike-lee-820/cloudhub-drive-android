name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "SDK=$SDK"
            echo "platforms:"; ls "$SDK/platforms" 2>&1 | tr '\n' ' '; echo
            echo "build-tools:"; ls "$SDK/build-tools" 2>&1 | tr '\n' ' '; echo
            MGR=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
            echo "sdkmanager=$MGR"
          } | tee probe.log
          MGR=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$MGR" ]; then
            dirname "$MGR" >> "$GITHUB_PATH"
            echo "SDKMANAGER=$MGR" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK packages if needed
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="${SDKMANAGER:-$(command -v sdkmanager || true)}"
          echo "manager=$MGR" | tee sdk.log
          if [ -d "$SDK/platforms/android-34" ] && [ -d "$SDK/build-tools/34.0.0" ]; then
            echo "Required SDK packages already present" | tee -a sdk.log
            exit 0
          fi
          if [ -z "$MGR" ] || [ ! -f "$MGR" ]; then
            echo "sdkmanager unavailable" | tee -a sdk.log
            exit 1
          fi
          yes | "$MGR" --licenses > sdk-licenses.log 2>&1 || true
          "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tee -a sdk.log

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: chmod +x gradlew && ./gradlew --version 2>&1 | tee gradle-version.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudhub-drive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: CloudHub Drive ${{ github.ref_name }}
          body: Automated debug build produced by Android Build workflow.

      - name: Publish failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = []
          for name in ["probe.log", "sdk-licenses.log", "sdk.log", "gradle-version.log", "build.log"]:
              f = Path(name)
              if f.exists():
                  parts.append("===== " + name + " =====\n" + f.read_text(errors="replace")[-12000:])
          text = "\n".join(parts) or "no logs captured"
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=CloudHub CI diagnostics::" + text[:60000])
          PY
